const iconPaths = {

function Icon({ name, className = "h-4 w-4" }) {
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
      <path d={iconPaths[name] ?? iconPaths.clock} />

}

const demoPrompt = `/run demo\nissue: Build a simple planning workflow card for OpenClaw dashboard\nmode: supervised\nagents: copilot, codex, gemini\ngates: plan, merge, production\nacceptance: show status cards, activity log, artifacts, and final report`;

const baseStages = [
  { id: "intake", title: "1. Intake", owner: "Telegram + OpenClaw", status: "queued", summary: "Waiting for a one-shot work request from Telegram.", artifact: "Requirement Brief" },
  { id: "planning", title: "2. Planning", owner: "Copilot CLI + Gemini CLI", status: "queued", summary: "Plan, task packet, risk notes, and acceptance criteria will be generated.", artifact: "Task Packet" },
  { id: "plan-gate", title: "3. Plan Gate", owner: "Human Controller", status: "queued", summary: "Wait for approval before writing code.", artifact: "Approval Record" },
  { id: "branch", title: "4. Branch Setup", owner: "Git CLI", status: "queued", summary: "Create feature branch and link it to the GitHub Issue.", artifact: "feature/issue-128-demo-plan-card" },
  { id: "implementation", title: "5. Implementation", owner: "Codex CLI", status: "queued", summary: "Implement the small planning card UI and demo data.", artifact: "Code Commit" },
  { id: "verification", title: "6. Verification", owner: "GitHub Actions", status: "queued", summary: "Run lint, build, and smoke tests.", artifact: "CI Report" },
  { id: "fix-loop", title: "7. Auto Fix Loop", owner: "Copilot Review + Codex CLI", status: "queued", summary: "Apply review comments and rerun verification if needed.", artifact: "Fix Commit" },
  { id: "pr", title: "8. Pull Request", owner: "GitHub", status: "queued", summary: "Open PR with summary, test evidence, and generated artifacts.", artifact: "PR Summary" },
  { id: "merge-gate", title: "9. Merge Gate", owner: "Human Controller", status: "queued", summary: "Wait for merge approval after CI is green.", artifact: "Merge Approval" },
  { id: "staging", title: "10. Staging", owner: "GitHub Environments", status: "queued", summary: "Deploy demo build to staging and collect evidence.", artifact: "Staging Evidence" },
  { id: "production", title: "11. Production", owner: "GitHub Actions", status: "queued", summary: "Deploy the approved demo dashboard.", artifact: "Deployment Record" },
  { id: "monitor", title: "12. Monitor", owner: "OpenClaw", status: "queued", summary: "Report final status back to Telegram and GitHub Issue.", artifact: "Telegram Status Report" },
];

const demoEvents = [
  { time: "10:00", source: "Telegram", text: "One-shot demo prompt submitted by Human Controller.", updates: [{ id: "intake", status: "running", summary: "Telegram command received. OpenClaw is normalizing the request." }] },
  { time: "10:01", source: "OpenClaw", text: "Created run demo-001 and linked GitHub Issue #128.", updates: [{ id: "intake", status: "done", summary: "Request captured and linked to GitHub Issue #128." }, { id: "planning", status: "running", summary: "Planner is generating task packet, risks, and acceptance criteria." }] },
  { time: "10:02", source: "Gemini CLI", text: "Summarized context and proposed a small dashboard card feature.", updates: [{ id: "planning", status: "running", summary: "Repository context summarized. Copilot CLI is shaping the implementation plan." }] },
  { time: "10:03", source: "Copilot CLI", text: "Generated Task Packet, ADR, and Test Plan artifacts.", updates: [{ id: "planning", status: "done", summary: "Task packet, ADR, and test plan generated." }, { id: "plan-gate", status: "blocked", summary: "Waiting for human approval before coding starts." }] },
  { time: "10:04", source: "Human", text: "Approved plan gate from Telegram.", updates: [{ id: "plan-gate", status: "done", summary: "Plan approved from Telegram command channel." }, { id: "branch", status: "running", summary: "Creating feature branch and linking it to the issue." }] },
  { time: "10:05", source: "Git CLI", text: "Created feature/issue-128-demo-plan-card and pushed initial commit.", updates: [{ id: "branch", status: "done", summary: "Feature branch created and pushed." }, { id: "implementation", status: "running", summary: "Codex CLI is implementing the demo planning card." }] },
  { time: "10:07", source: "Codex CLI", text: "Implemented the UI card, demo data, and progress calculation.", updates: [{ id: "implementation", status: "done", summary: "Demo UI and status logic implemented." }, { id: "verification", status: "running", summary: "GitHub Actions is running lint, build, and smoke tests." }] },
  { time: "10:08", source: "GitHub Actions", text: "Build failed once because one status was missing from the style map.", updates: [{ id: "verification", status: "failed", summary: "First build failed. Missing status style detected." }, { id: "fix-loop", status: "running", summary: "Auto-fix loop started. Codex will patch the status map and rerun tests." }] },
  { time: "10:09", source: "Codex CLI", text: "Auto-fixed status map and added data validation tests.", updates: [{ id: "fix-loop", status: "done", summary: "Fix applied and extra self-tests added." }, { id: "verification", status: "running", summary: "CI is rerunning after the auto-fix." }] },
  { time: "10:10", source: "GitHub Actions", text: "CI passed: build, lint, and smoke checks are green.", updates: [{ id: "verification", status: "done", summary: "CI passed after one controlled auto-fix loop." }, { id: "pr", status: "running", summary: "Opening pull request with summary and test evidence." }] },
  { time: "10:11", source: "GitHub", text: "Opened Pull Request #42 with generated artifacts attached.", updates: [{ id: "pr", status: "done", summary: "Pull Request #42 opened with test evidence." }, { id: "merge-gate", status: "blocked", summary: "Waiting for human approval to merge." }] },
  { time: "10:12", source: "Human", text: "Approved merge gate from Telegram.", updates: [{ id: "merge-gate", status: "done", summary: "Merge approved by Human Controller." }, { id: "staging", status: "running", summary: "Deploying the demo to staging." }] },
  { time: "10:13", source: "GitHub Environments", text: "Staging deployment completed and smoke evidence collected.", updates: [{ id: "staging", status: "done", summary: "Staging deployment passed smoke checks." }, { id: "production", status: "running", summary: "Production demo deployment started." }] },
  { time: "10:14", source: "GitHub Actions", text: "Production deployment completed successfully.", updates: [{ id: "production", status: "done", summary: "Production deployment completed." }, { id: "monitor", status: "running", summary: "OpenClaw is preparing the final report." }] },
  { time: "10:15", source: "OpenClaw", text: "Final report sent to Telegram and GitHub Issue #128 moved to Done.", updates: [{ id: "monitor", status: "done", summary: "Final report sent. GitHub Issue #128 moved to Done." }] },
];

const statusStyle = {
  done:    { label: "Done",          badge: "bg-emerald-500/15 text-emerald-300 ring-emerald-500/30", border: "border-emerald-500/40",  dot: "bg-emerald-400",  glow: "glow-emerald", icon: "check"  },
  running: { label: "Running",       badge: "bg-sky-500/15 text-sky-300 ring-sky-500/30",             border: "border-sky-500/40",     dot: "bg-sky-400",     glow: "glow-sky",    icon: "loader" },
  queued:  { label: "Queued",        badge: "bg-white/5 text-slate-400 ring-white/10",                border: "border-white/10",       dot: "bg-slate-500",   glow: "",            icon: "clock"  },
  blocked: { label: "Needs approval",badge: "bg-amber-500/15 text-amber-300 ring-amber-500/30",      border: "border-amber-500/40",   dot: "bg-amber-400",   glow: "glow-amber",  icon: "pause"  },
  failed:  { label: "Failed",        badge: "bg-red-500/15 text-red-300 ring-red-500/30",             border: "border-red-500/40",     dot: "bg-red-400",     glow: "glow-red",    icon: "alert"  },
};

const statusWeights = { done: 1, running: 0.5, blocked: 0.5, failed: 0.5, queued: 0 };

function applyDemoEvents(eventCount) {
  const stageMap = new Map(baseStages.map((stage) => [stage.id, { ...stage }]));
  demoEvents.slice(0, eventCount).forEach((event) => {
    event.updates.forEach((update) => {
      const current = stageMap.get(update.id);
      if (current) stageMap.set(update.id, { ...current, ...update });
    });
  });
  return baseStages.map((stage) => stageMap.get(stage.id));
}

function calculateProgress(items) {
  if (!items.length) return 0;
  const total = items.reduce((sum, item) => sum + (statusWeights[item.status] ?? 0), 0);
  return Math.round((total / items.length) * 100);
}

function StatusBadge({ status }) {
  const meta = statusStyle[status] ?? statusStyle.queued;
  return (
    <span className={`inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-semibold ring-1 ${meta.badge}`}>
      <Icon name={meta.icon} className={`h-3 w-3 ${status === "running" ? "spin-slow" : ""}`} />
      {meta.label}
    </span>
  );
}

function StageCard({ stage, compact }) {
  const meta = statusStyle[stage.status] ?? statusStyle.queued;
  return (
    <div className={`relative rounded-2xl border glass-card p-4 card-hover ${meta.border} ${stage.status !== "queued" ? meta.glow : ""}`}>
      <div className="flex items-start justify-between gap-3">
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2">
            <span className={`h-2 w-2 flex-shrink-0 rounded-full ${meta.dot} ${stage.status === "running" ? "pulse-dot" : ""}`} />
            <h3 className="text-sm font-semibold text-white truncate">{stage.title}</h3>
          </div>
          <p className="mt-1 text-xs text-slate-400">{stage.owner}</p>
        </div>
        <StatusBadge status={stage.status} />
      </div>
      {!compact && (
        <>
          <p className="mt-3 text-xs leading-5 text-slate-300">{stage.summary}</p>
          <div className="mt-3 rounded-xl bg-white/5 px-3 py-2 text-xs text-slate-400 ring-1 ring-white/10">
            <span className="text-slate-500">Artifact: </span><span className="font-medium text-slate-200">{stage.artifact}</span>
          </div>
        </>
      )}
    </div>
  );
}

function MetricCard({ icon, label, value, note, accent }) {
  const accents = {
    violet: "from-violet-500/20 to-violet-600/5 border-violet-500/30 text-violet-400",
    sky:    "from-sky-500/20 to-sky-600/5 border-sky-500/30 text-sky-400",
    emerald:"from-emerald-500/20 to-emerald-600/5 border-emerald-500/30 text-emerald-400",
    amber:  "from-amber-500/20 to-amber-600/5 border-amber-500/30 text-amber-400",
  };
  const a = accents[accent] ?? accents.violet;
  return (
    <div className={`rounded-2xl border bg-gradient-to-br p-5 card-hover ${a}`}>
      <div className="flex items-center gap-3">
        <div className={`rounded-xl bg-white/10 p-2.5`}>
          <Icon name={icon} className={`h-5 w-5 ${a.split(" ").find(c => c.startsWith("text-"))}`} />
        </div>
        <div className="min-w-0">
          <p className="text-xs text-slate-400">{label}</p>
          <p className="text-lg font-bold text-white truncate">{value}</p>
        </div>
      </div>
      <p className="mt-3 text-xs leading-5 text-slate-400 line-clamp-2">{note}</p>
    </div>
  );
}

function ActivityLog({ events }) {
  const sourceColors = {
    Telegram: "text-sky-400", OpenClaw: "text-violet-400", "Gemini CLI": "text-emerald-400",
    "Copilot CLI": "text-blue-400", "Git CLI": "text-orange-400", "Codex CLI": "text-pink-400",
    "GitHub Actions": "text-yellow-400", GitHub: "text-slate-300", Human: "text-rose-400",
    "GitHub Environments": "text-cyan-400",
  };
  return (
    <div className="rounded-2xl border border-white/10 glass p-5">
      <div className="flex items-center gap-2 mb-4">
        <Icon name="terminal" className="h-4 w-4 text-violet-400" />
        <h2 className="text-sm font-semibold text-white">Live Activity</h2>
        {events.length > 0 && <span className="ml-auto text-xs text-slate-500">{events.length} events</span>}
      </div>
      <div className="max-h-[380px] space-y-2 overflow-auto pr-1">
        {events.length === 0 ? (
          <div className="rounded-xl bg-white/5 p-4 text-xs text-slate-400 ring-1 ring-white/10 text-center">Click <span className="text-violet-300 font-medium">Run Demo</span> to start the simulated SDLC flow.</div>
        ) : (
          [...events].reverse().map((event, index) => (
            <div key={`${event.time}-${event.source}-${index}`} className="rounded-xl bg-white/5 p-3 ring-1 ring-white/8">
              <div className="flex items-center justify-between gap-3">
                <span className={`text-xs font-semibold ${sourceColors[event.source] ?? "text-slate-300"}`}>{event.source}</span>
                <span className="text-xs text-slate-500 font-mono">{event.time}</span>
              </div>
              <p className="mt-1 text-xs leading-5 text-slate-400">{event.text}</p>
            </div>
          ))
        )}
      </div>
    </div>
  );
}

function ArtifactList({ stages }) {
  const generated = stages.filter((stage) => stage.status === "done");
  return (
    <div className="rounded-2xl border border-white/10 glass p-5">
      <div className="flex items-center gap-2 mb-4">
        <Icon name="sparkles" className="h-4 w-4 text-emerald-400" />
        <h2 className="text-sm font-semibold text-white">Generated Artifacts</h2>
        {generated.length > 0 && <span className="ml-auto rounded-full bg-emerald-500/20 px-2 py-0.5 text-xs font-semibold text-emerald-300 ring-1 ring-emerald-500/30">{generated.length}</span>}
      </div>
      <div className="space-y-2">
        {generated.length === 0 ? (
          <div className="rounded-xl bg-white/5 px-3 py-3 text-xs text-slate-400 ring-1 ring-white/10 text-center">No artifacts generated yet.</div>
        ) : (
          generated.map((stage) => (
            <div key={stage.id} className="flex items-center justify-between gap-3 rounded-xl bg-emerald-500/10 px-3 py-2.5 text-xs ring-1 ring-emerald-500/20">
              <div className="flex items-center gap-2 min-w-0">
                <Icon name="check" className="h-3 w-3 text-emerald-400 flex-shrink-0" />
                <span className="font-medium text-emerald-200 truncate">{stage.artifact}</span>
              </div>
              <span className="text-emerald-500 flex-shrink-0">{stage.title.split(".")[0]}.</span>
            </div>
          ))
        )}
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState("expanded");
  const [eventCount, setEventCount] = useState(0);
  const [isRunning, setIsRunning] = useState(false);

  useEffect(() => {
    if (!isRunning) return undefined;
    if (eventCount >= demoEvents.length) {
      setIsRunning(false);
      return undefined;
    }
    const timer = window.setTimeout(() => setEventCount((count) => Math.min(count + 1, demoEvents.length)), 900);
    return () => window.clearTimeout(timer);
  }, [eventCount, isRunning]);

  const compact = view === "compact";
  const visibleStages = useMemo(() => applyDemoEvents(eventCount), [eventCount]);
  const visibleEvents = useMemo(() => demoEvents.slice(0, eventCount), [eventCount]);
  const progress = useMemo(() => calculateProgress(visibleStages), [visibleStages]);
  const currentEvent = visibleEvents[visibleEvents.length - 1];
  const doneCount = visibleStages.filter((stage) => stage.status === "done").length;
  const pendingGates = visibleStages.filter((stage) => stage.status === "blocked").length;
  const hasFailedStage = visibleStages.some((stage) => stage.status === "failed");

  const runDemo = () => { setEventCount(0); setIsRunning(true); };
  const stepOnce = () => { setIsRunning(false); setEventCount((count) => Math.min(count + 1, demoEvents.length)); };
  const resetDemo = () => { setIsRunning(false); setEventCount(0); };

  return (
    <div className="min-h-screen bg-mesh p-4 md:p-6 text-slate-100">
      <div className="mx-auto max-w-7xl space-y-5">

        {/* Header */}
        <header className="rounded-3xl border border-white/10 glass p-6">
          <div className="flex flex-col gap-5 lg:flex-row lg:items-center lg:justify-between">
            <div>
              <div className="inline-flex items-center gap-2 rounded-full bg-white/10 px-3 py-1 text-xs font-medium text-slate-300 ring-1 ring-white/10">
                <Icon name="bot" className="h-3.5 w-3.5 text-violet-400" />
                <span>OpenClaw SDLC Control Room</span>
                <span className="ml-1 rounded-full bg-violet-500/30 px-1.5 py-0.5 text-violet-300 text-[10px] font-semibold">Demo</span>
              </div>
              <h1 className="mt-3 text-3xl font-extrabold tracking-tight">
                <span className="gradient-text">One-Shot Pipeline</span>
                <span className="text-white"> Demo</span>
              </h1>
              <p className="mt-2 max-w-2xl text-sm leading-6 text-slate-400">
                Telegram prompt → OpenClaw planning → branch → implementation → CI failure → auto-fix → PR → staging → production → final report.
              </p>
            </div>
            <div className="flex flex-wrap gap-2.5 lg:flex-col xl:flex-row">
              <button onClick={runDemo} className="inline-flex items-center justify-center gap-2 rounded-2xl bg-gradient-to-br from-violet-600 to-blue-600 px-5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-violet-500/25 transition hover:from-violet-500 hover:to-blue-500 hover:shadow-violet-500/40">
                <Icon name="play" className="h-4 w-4" />
                Run Demo
              </button>
              <button onClick={stepOnce} disabled={eventCount >= demoEvents.length} className="inline-flex items-center justify-center gap-2 rounded-2xl border border-white/15 bg-white/8 px-4 py-2.5 text-sm font-semibold text-slate-200 backdrop-blur transition hover:bg-white/12 disabled:cursor-not-allowed disabled:opacity-40">
                <Icon name="terminal" className="h-4 w-4" />
                Step Once
              </button>
              <button onClick={resetDemo} className="inline-flex items-center justify-center gap-2 rounded-2xl border border-white/15 bg-white/8 px-4 py-2.5 text-sm font-semibold text-slate-200 backdrop-blur transition hover:bg-white/12">
                Reset
              </button>
            </div>
          </div>
        </header>

        {/* Metric Cards */}
        <section className="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
          <MetricCard accent="violet" icon="rocket"    label="Demo run"       value="demo-001"                            note={`${doneCount}/${visibleStages.length} stages completed.`} />
          <MetricCard accent="sky"    icon="cpu"       label="Current actor"  value={currentEvent?.source ?? "Idle"}      note={currentEvent?.text ?? "Waiting for Run Demo."} />
          <MetricCard accent="emerald"icon="pr"        label="Pull request"   value={eventCount >= 11 ? "PR #42" : "—"}   note="PR appears after verification is green." />
          <MetricCard accent="amber"  icon="shield"    label="Attention"      value={hasFailedStage ? "Auto-fix" : `${pendingGates} gate(s)`} note={hasFailedStage ? "A controlled fix loop is in progress." : "Human approval gates simulated in this demo."} />
        </section>

        {/* Main Grid */}
        <section className="grid gap-5 lg:grid-cols-[1.8fr_1fr]">
          {/* Left: Workflow Timeline */}
          <div className="rounded-3xl border border-white/10 glass p-5">
            <div className="mb-5 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
              <div>
                <h2 className="text-base font-bold text-white">Workflow Timeline</h2>
                <p className="text-xs text-slate-400 mt-0.5">Cards update as each simulated event arrives.</p>
              </div>
              <div className="flex rounded-2xl bg-white/8 p-1 ring-1 ring-white/10 w-fit">
                {[{ id: "expanded", label: "Expanded" }, { id: "compact", label: "Compact" }].map((item) => (
                  <button key={item.id} onClick={() => setView(item.id)} className={`rounded-xl px-3 py-1.5 text-xs font-semibold transition ${view === item.id ? "bg-violet-600 text-white shadow" : "text-slate-400 hover:text-slate-200"}`}>
                    {item.label}
                  </button>
                ))}
              </div>
            </div>

            {/* Progress Bar */}
            <div className="mb-6">
              <div className="mb-2 flex items-center justify-between text-xs">
                <span className="font-semibold text-slate-300">Overall progress</span>
                <span className="font-bold text-white">{progress}%</span>
              </div>
              <div className="h-2.5 overflow-hidden rounded-full bg-white/10">
                <div
                  style={{ width: `${progress}%` }}
                  className="h-full rounded-full bg-gradient-to-r from-violet-500 via-blue-500 to-emerald-400 progress-glow transition-all duration-700 ease-out"
                />
              </div>
            </div>

            <div className={`grid gap-3 ${compact ? "grid-cols-2 md:grid-cols-3 xl:grid-cols-4" : "md:grid-cols-2 xl:grid-cols-3"}`}>
              {visibleStages.map((stage) => <StageCard key={stage.id} stage={stage} compact={compact} />)}
            </div>
          </div>

          {/* Right: Sidebar */}
          <aside className="space-y-5">
            {/* Demo Prompt */}
            <div className="rounded-2xl border border-white/10 glass p-5">
              <div className="flex items-center gap-2 mb-3">
                <Icon name="terminal" className="h-4 w-4 text-slate-400" />
                <h2 className="text-sm font-semibold text-white">Demo Prompt</h2>
              </div>
              <pre className="whitespace-pre-wrap rounded-xl bg-black/40 p-4 font-mono text-xs leading-6 text-emerald-300 ring-1 ring-white/10">{demoPrompt}</pre>
            </div>

            <ActivityLog events={visibleEvents} />
            <ArtifactList stages={visibleStages} />

            {/* Demo Rule */}
            <div className="rounded-2xl border border-amber-500/30 bg-amber-500/10 p-4">
              <div className="flex items-start gap-3">
                <Icon name="pause" className="mt-0.5 h-4 w-4 text-amber-400 flex-shrink-0" />
                <div>
                  <h2 className="text-xs font-semibold text-amber-300">Demo rule</h2>
                  <p className="mt-1 text-xs leading-5 text-amber-400/80">
                    Human gates are simulated here. In a real OpenClaw setup, these buttons should call the backend or Telegram approval command.
                  </p>
                </div>
              </div>
            </div>
          </aside>
        </section>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

    </script>
  </body>
</html>
